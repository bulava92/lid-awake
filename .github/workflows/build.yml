name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build -c release
      - name: Test
        run: swift test
      - name: Validate scripts
        run: |
          zsh -n install.sh
          zsh -n uninstall.sh
          zsh -n scripts/lid-awake-helper
